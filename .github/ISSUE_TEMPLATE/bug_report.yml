name: Bug Report
description: Create a report to help us improve the Oral Check Assist app or inference pipeline.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: environment
    attributes:
      label: Environment & Platform
      description: Operating System, Device, Flutter SDK version, ONNX runtime version.
      placeholder: e.g., Android 14 / Pixel 7, Web (Chrome 120), Flutter 3.19.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open app
        2. Go to screening session
        3. Capture image
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Trace
      description: Please paste any relevant console logs, stack traces, or terminal output.
      render: shell
