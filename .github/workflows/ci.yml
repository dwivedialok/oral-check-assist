name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    name: Flutter Analyze, Test & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin so CI matches a known-good SDK; bump deliberately with local upgrades.
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Verify Model Assets
        run: bash scripts/verify_model_assets.sh

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test
